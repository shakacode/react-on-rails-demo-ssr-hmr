name: Cleanup Stale Review Apps

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  cleanup:
    # Cleanup targets the current inferred review-app prefix. If you changed
    # naming conventions, manually delete review apps under the old prefix.
    uses: shakacode/control-plane-flow/.github/workflows/cpflow-cleanup-stale-review-apps.yml@6aa575780f2d9175755881b79cbb3253adbc9c1f # v6.0.1
    secrets:
      CPLN_TOKEN_STAGING: ${{ secrets.CPLN_TOKEN_STAGING }}
